<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>DIVEST 7 — Offline</title>
    <style>
      :root { color-scheme: dark; }
      body {
        margin: 0; min-height: 100dvh; display: grid; place-items: center;
        background: #04070d; color: #f7f2e8; text-align: center; padding: 2rem;
        font-family: "Jost", "Avenir Next", system-ui, sans-serif; font-weight: 300;
      }
      .wrap { max-width: 26rem; }
      .rule { height: 1px; width: 3.5rem; margin: 0 auto 2rem;
        background: linear-gradient(90deg, transparent, #d0a04d, transparent); }
      h1 { font-family: Georgia, serif; font-weight: 400; letter-spacing: 0.22em;
        text-transform: uppercase; font-size: 1.1rem; margin: 0 0 1.25rem; }
      p { color: #9db0c7; line-height: 1.75; font-size: 0.95rem; margin: 0 0 2rem; }
      a { display: inline-block; color: #e4be72; text-decoration: none;
        border: 1px solid rgba(208,160,77,.45); border-radius: 999px;
        padding: 0.8rem 1.9rem; font-size: 0.7rem; letter-spacing: 0.22em; text-transform: uppercase; }
    </style>
  </head>
  <body>
    <div class="wrap">
      <div class="rule"></div>
      <h1>Divest 7</h1>
      <p>You are offline. The pages you have already visited are still here — reconnect to load the rest of the year.</p>
      <a href="/today">Try again</a>
    </div>
  </body>
</html>
